{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">Add Housekeeping Staff</h1></div>
<div class="card" style="max-width:600px;"><div class="card-body">
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}</div>{% endfor %}
<div class="d-flex gap-2"><button type="submit" class="btn btn-gold">Save</button><a href="{% url 'housekeeping:staff_list' %}" class="btn btn-light">Cancel</a></div>
</form>
</div></div>
{% endblock %}
