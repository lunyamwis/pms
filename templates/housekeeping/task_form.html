{% extends "base.html" %}
{% block title %}Schedule Cleaning{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">Schedule Cleaning Task</h1></div>
<div class="card" style="max-width:600px;"><div class="card-body">
<form method="post">{% csrf_token %}
<div class="row g-3">{% for f in form %}<div class="col-md-6"><label class="form-label">{{ f.label }}</label>{{ f }}{% if f.errors %}<div class="text-danger" style="font-size:12px;">{{ f.errors }}</div>{% endif %}</div>{% endfor %}</div>
<div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-gold">Schedule</button><a href="{% url 'housekeeping:task_list' %}" class="btn btn-light">Cancel</a></div>
</form>
</div></div>
{% endblock %}
