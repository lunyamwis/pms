{% extends "base.html" %}
{% block title %}Calendar{% endblock %}
{% block breadcrumb_active %}Calendar{% endblock %}
{% block extra_head %}
<style>#calendar { height: 650px; } .fc-event { cursor: pointer; border-radius: 4px; font-size: 12px; } .fc .fc-toolbar-title { font-family: 'Playfair Display', serif; }</style>
{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div><h1 class="page-title">Booking Calendar</h1></div>
    <a href="{% url 'bookings:create' %}" class="btn btn-gold"><i class="fas fa-plus me-2"></i>New Booking</a>
</div>
<div class="card"><div class="card-body"><div id="calendar"></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listMonth' },
        events: '{% url "bookings:calendar_events" %}',
        eventClick: function(info) { window.location = info.event.url; info.jsEvent.preventDefault(); },
        height: 650,
    });
    calendar.render();
});
</script>
{% endblock %}
