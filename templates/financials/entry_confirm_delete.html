{% extends "base.html" %}
{% block title %}Delete Entry{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title text-danger">Delete Entry</h1></div>
<div class="card" style="max-width:500px;"><div class="card-body">
<p>Delete entry <strong>{{ object.description }}</strong> ({{ object.amount }}) on {{ object.date }}?</p>
<form method="post">{% csrf_token %}<div class="d-flex gap-2"><button type="submit" class="btn btn-danger">Delete</button><a href="{% url 'financials:cashbook' %}" class="btn btn-light">Cancel</a></div></form>
</div></div>
{% endblock %}
